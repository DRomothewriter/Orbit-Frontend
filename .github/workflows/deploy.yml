name: Orbit Frontend CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: orbit-frontend-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build Angular and Deploy to S3 + CloudFront
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify workflow specifications
        run: node --test tests/deploy.workflow.test.js

      - name: Build Angular application (Production)
        run: npm run build -- --configuration=production

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}
          role-session-name: GitHubActions-OrbitFrontend-${{ github.run_id }}

      - name: Deploy static assets to S3
        env:
          S3_BUCKET: ${{ secrets.S3_FRONTEND_BUCKET_NAME || vars.S3_FRONTEND_BUCKET_NAME }}
        run: |
          echo "Synchronizing compiled Angular bundles to S3 bucket: $S3_BUCKET"
          aws s3 sync dist/orbit-frontend/browser/ "s3://$S3_BUCKET/" --delete

      - name: Invalidate CloudFront distribution cache
        env:
          DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID || vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          echo "Invalidating CloudFront distribution: $DISTRIBUTION_ID"
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*"

      - name: Deployment completed
        run: echo "✅ Orbit Frontend successfully built and deployed to S3 with CloudFront cache invalidated."