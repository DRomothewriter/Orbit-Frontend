<div class="input-container">
    <form (ngSubmit)="handleSubmit()">
        <button
            type="button"
            class="icon-btn"
            (click)="openEventModal()"
            title="Crear evento"
            aria-label="Crear evento"
        >
            <mat-icon aria-hidden="true">event</mat-icon>
        </button>

        <label class="image-upload icon-btn" title="Adjuntar imagen" aria-label="Adjuntar imagen">
            <input
                #imageInput
                type="file"
                accept="image/*"
                (change)="handleImage($event)"
                hidden
            />
            <mat-icon aria-hidden="true">image</mat-icon>
        </label>

        <input
            type="text"
            [(ngModel)]="message"
            name="message"
            #messageInput
            placeholder="Escribe un mensaje..."
            aria-label="Escribe un mensaje"
            autocomplete="off"
        />

        <button
            type="submit"
            [disabled]="!message.trim() && !imageFile"
            class="send-btn"
            aria-label="Enviar mensaje"
        >
            <mat-icon aria-hidden="true">send</mat-icon>
        </button>

        @if (imagePreview) {
            <div class="image-preview">
                <img [src]="imagePreview" alt="Vista previa de imagen a enviar" />
                <button type="button" (click)="removeImage()" aria-label="Quitar imagen adjunta">
                    <mat-icon aria-hidden="true">close</mat-icon>
                </button>
            </div>
        }
    </form>
</div>

@if (showEventModal) {
    <app-create-event-modal
        (onClose)="closeEventModal()"
        (onCreate)="handleCreateEvent($event)"
    ></app-create-event-modal>
}
