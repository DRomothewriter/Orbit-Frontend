@if (isLoading) {
    <app-orbit-loader
        variant="pulsar"
        size="md"
        [fullArea]="true"
        label="Escaneando señales..."
    />
} @else {
    <ul>
        @for (fr of friendRequests; track fr._id) {
            <li [style.animation-delay]="($index < 10 ? $index * 45 : 0) + 'ms'">
                <div class="avatar-container">
                    <img
                        [src]="fr.userId.profileImgUrl | orbitAvatar:(fr.userId._id || fr.userId.username)"
                        [alt]="fr.userId.username"
                        class="avatar-img"
                    />
                </div>
                <div class="user-info">
                    <span class="user-name">{{ fr.userId.username }}</span>
                    <span class="user-email">{{ fr.userId.email }}</span>
                </div>
                <button type="button" (click)="acceptFriendRequest(fr._id!)">Aceptar</button>
            </li>
        } @empty {
            <li>Sin solicitudes pendientes</li>
        }
    </ul>
}
