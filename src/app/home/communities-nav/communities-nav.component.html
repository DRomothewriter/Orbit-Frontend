<nav class="communities-nav" aria-label="Comunidades">
    <ul>
        <li [class.selected]="selectedCommunityId === ''">
            <button
                type="button"
                class="community-btn"
                (click)="goToHome()"
                aria-label="Mensajes directos e inicio"
                [attr.aria-current]="selectedCommunityId === '' ? 'page' : null"
            >
                <img src="assets/orbit-dm-icon.svg" alt="" aria-hidden="true" />
            </button>
        </li>
        @for (community of communities; track community._id) {
            <li [class.selected]="community._id === selectedCommunityId">
                <button
                    type="button"
                    class="community-btn"
                    (click)="selectCommunity(community)"
                    [attr.aria-label]="community.communityName || 'Comunidad'"
                    [attr.aria-current]="community._id === selectedCommunityId ? 'page' : null"
                >
                    <img
                        [src]="community.communityImgUrl | orbitAvatar:(community._id || community.communityName)"
                        [alt]="community.communityName || 'Comunidad'"
                    />
                </button>
            </li>
        }
        <li>
            <button
                type="button"
                class="community-btn add-community-btn"
                (click)="openCreateCommunity()"
                aria-label="Crear nueva comunidad"
            >
                <mat-icon aria-hidden="true">add</mat-icon>
            </button>
        </li>
    </ul>
</nav>
