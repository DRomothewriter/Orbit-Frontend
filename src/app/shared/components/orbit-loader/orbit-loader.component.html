<div
  class="orbit-loader-wrapper"
  [class.full-area]="fullArea"
  [class.is-exiting]="exiting"
  [attr.data-size]="size"
  [attr.data-variant]="variant"
  role="status"
  aria-live="polite"
  [attr.aria-label]="label || 'Cargando'"
>
  @switch (variant) {
    <!-- 1. SINGULARITY (Hoyo Negro Gargantua — Mensajes de Chat) -->
    @case ('singularity') {
      <div class="gargantua-system" aria-hidden="true">
        <span class="star s1"></span>
        <span class="star s2"></span>
        <span class="star s3"></span>
        <span class="star s4"></span>

        <div class="release-wave"></div>
        <div class="accretion-disk"></div>

        <div class="orbit-ring ring-outer">
          <span class="planet p-violet"></span>
        </div>
        <div class="orbit-ring ring-mid">
          <span class="planet p-amber"></span>
        </div>
        <div class="orbit-ring ring-inner">
          <span class="planet p-ivory"></span>
        </div>

        <div class="event-horizon"></div>
      </div>
    }

    <!-- 2. ECLIPSE (Skeletons de Órbita con barrido estelar — Sidebar de Grupos) -->
    @case ('eclipse') {
      <div class="eclipse-skeletons" aria-hidden="true">
        @for (row of skeletonRows; track row) {
          <div class="skeleton-row" [style.--row-index]="row">
            <span class="skeleton-orb"></span>
            <div class="skeleton-lines">
              <span class="skeleton-line primary"></span>
              <span class="skeleton-line secondary"></span>
            </div>
          </div>
        }
      </div>
    }

    <!-- 3. CONSTELLATION (Trazado de Constelación — Lista de Amigos) -->
    @case ('constellation') {
      <div class="constellation-system" aria-hidden="true">
        <svg viewBox="0 0 120 76" fill="none" class="constellation-svg">
          <path
            class="constellation-path"
            d="M16 52 L44 26 L74 38 L104 16 M44 26 L56 60"
          />
          <circle class="c-star cs1" cx="16" cy="52" r="2.8" />
          <circle class="c-star cs2" cx="44" cy="26" r="3.4" />
          <circle class="c-star cs3" cx="74" cy="38" r="2.6" />
          <circle class="c-star cs4" cx="104" cy="16" r="3.2" />
          <circle class="c-star cs5" cx="56" cy="60" r="2.2" />
        </svg>
      </div>
    }

    <!-- 4. PULSAR (Ondas de Radioastronomía — Solicitudes Pendientes) -->
    @case ('pulsar') {
      <div class="pulsar-system" aria-hidden="true">
        <span class="pulsar-wave w1"></span>
        <span class="pulsar-wave w2"></span>
        <span class="pulsar-wave w3"></span>
        <span class="pulsar-core"></span>
      </div>
    }

    <!-- 5. ASTROLABE (Retícula de Observatorio — Buscador de Cuadrante) -->
    @case ('astrolabe') {
      <div class="astrolabe-system" aria-hidden="true">
        <span class="astro-ring outer"></span>
        <span class="astro-ring inner"></span>
        <span class="astro-axis horizontal"></span>
        <span class="astro-axis vertical"></span>
        <span class="astro-sweep"></span>
        <span class="astro-center"></span>
      </div>
    }

    <!-- 6. COMET (Cometa con núcleo brillante y cola de iones/polvo — Inline xs/sm y modales) -->
    @case ('comet') {
      <div class="comet-system" aria-hidden="true">
        <svg viewBox="0 0 36 36" fill="none" class="comet-svg">
          <defs>
            <linearGradient id="orbitCometTail" x1="6" y1="24" x2="29" y2="9" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#6d28d9" stop-opacity="0" />
              <stop offset="45%" stop-color="#a78bfa" stop-opacity="0.55" />
              <stop offset="85%" stop-color="#ddd6fe" stop-opacity="0.9" />
              <stop offset="100%" stop-color="#faf7f2" stop-opacity="1" />
            </linearGradient>
            <linearGradient id="orbitCometDust" x1="8" y1="27" x2="28" y2="11" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#7c3aed" stop-opacity="0" />
              <stop offset="65%" stop-color="#c4b5fd" stop-opacity="0.35" />
              <stop offset="100%" stop-color="#faf7f2" stop-opacity="0.7" />
            </linearGradient>
          </defs>

          <circle cx="18" cy="18" r="13.5" class="comet-track" />

          <g class="comet-orbit-group">
            <path
              d="M 7.2 26.2 A 13.5 13.5 0 0 1 28.2 9.2"
              stroke="url(#orbitCometTail)"
              stroke-width="2.2"
              stroke-linecap="round"
              class="comet-arc"
            />
            <path
              d="M 10.5 28.8 A 14.6 14.6 0 0 1 27.6 10.8"
              stroke="url(#orbitCometDust)"
              stroke-width="1"
              stroke-linecap="round"
              stroke-dasharray="12 4"
              class="comet-dust"
            />
            <circle cx="13.5" cy="11.2" r="0.85" class="comet-spark" />
            <circle cx="9.8" cy="17.8" r="0.65" class="comet-spark s-dim" />
            <circle cx="28.4" cy="9.2" r="4.4" class="comet-coma" />
            <circle cx="28.4" cy="9.2" r="2.2" class="comet-nucleus" />
          </g>
        </svg>
      </div>
    }
  }

  @if (label) {
    <span class="loader-label">{{ label }}</span>
  }
</div>
