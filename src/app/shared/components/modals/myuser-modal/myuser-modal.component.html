<div class="modal-overlay" [class.is-closing]="isClosing" (click)="closeModal()">
    <article
        class="modal-content"
        [class.is-closing]="isClosing"
        [style.top.px]="modalTop"
        [style.left.px]="modalLeft"
        [style.transformOrigin]="transformOrigin"
        role="dialog"
        aria-modal="true"
        aria-label="Perfil de usuario"
        (click)="$event.stopPropagation()"
    >
        <button
            type="button"
            class="close-btn"
            (click)="closeModal()"
            aria-label="Cerrar perfil"
        >
            <mat-icon aria-hidden="true">close</mat-icon>
        </button>

        <div class="profile-info">
            <div class="avatar-container">
                <img
                    [src]="user.profileImgUrl | orbitAvatar:(user._id || user.username)"
                    [alt]="user.username || 'Avatar de usuario'"
                    class="profile-avatar"
                />
                <label
                    class="edit-badge"
                    aria-label="Cambiar foto de perfil"
                    title="Cambiar foto de perfil"
                >
                    <input
                        type="file"
                        accept="image/*"
                        (change)="editProfileImage($event)"
                        hidden
                    />
                    <mat-icon aria-hidden="true">edit</mat-icon>
                </label>
            </div>

            @if (!editingUsername) {
                <button
                    type="button"
                    class="username-display"
                    (click)="enableUsernameEdit()"
                    title="Editar nombre de usuario"
                >
                    <span>{{ user.username }}</span>
                    <mat-icon class="edit-hint" aria-hidden="true">edit</mat-icon>
                </button>
            } @else {
                <input
                    class="username-input"
                    [(ngModel)]="newUsername"
                    aria-label="Nuevo nombre de usuario"
                    (blur)="submitUsernameEdit()"
                    (keydown.enter)="submitUsernameEdit()"
                    autofocus
                />
            }

            <p class="email">{{ user.email }}</p>
            <p class="member-since">Miembro desde {{ user.createdAt | date:'MMM d, y' }}</p>
        </div>

        <div class="status-selector" role="group" aria-label="Estado de presencia">
            <button
                type="button"
                [class.active]="user.status === UserStatus.ONLINE"
                [attr.aria-pressed]="user.status === UserStatus.ONLINE"
                (click)="setStatus(UserStatus.ONLINE)"
            >
                <span class="dot" aria-hidden="true"></span>
                <span>En línea</span>
            </button>
            <button
                type="button"
                [class.active]="user.status === UserStatus.WORKING"
                [class.working]="user.status === UserStatus.WORKING"
                [attr.aria-pressed]="user.status === UserStatus.WORKING"
                (click)="setStatus(UserStatus.WORKING)"
            >
                <mat-icon class="status-icon" aria-hidden="true">work</mat-icon>
                <span>Ocupado</span>
            </button>
            <button
                type="button"
                [class.active]="user.status === UserStatus.OFFLINE"
                [class.offline]="user.status === UserStatus.OFFLINE"
                [attr.aria-pressed]="user.status === UserStatus.OFFLINE"
                (click)="setStatus(UserStatus.OFFLINE)"
            >
                <span class="dot" aria-hidden="true"></span>
                <span>Desconectado</span>
            </button>
        </div>

        <button type="button" class="logout-btn" (click)="handleLogout()">
            Cerrar sesión
        </button>
    </article>
</div>
