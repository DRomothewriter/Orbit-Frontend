<div class="calendar-shell" (click)="closeCalendar()">
    <div
        class="calendar-modal-card"
        role="dialog"
        aria-modal="true"
        aria-label="Calendario de eventos"
        (click)="$event.stopPropagation()"
    >
        <button
            type="button"
            class="close-calendar-btn"
            (click)="closeCalendar()"
            aria-label="Cerrar calendario"
        >
            <span aria-hidden="true">×</span>
        </button>

        <!-- Calendario Principal -->
        <section class="calendar-main">
            <header class="calendar-toolbar">
                <div class="calendar-nav-group">
                    <button type="button" class="nav-arrow-btn" (click)="prevMonth()" aria-label="Mes anterior">
                        <span aria-hidden="true">‹</span>
                    </button>
                    <h2 class="calendar-month-title">{{ monthYear }}</h2>
                    <button type="button" class="nav-arrow-btn" (click)="nextMonth()" aria-label="Mes siguiente">
                        <span aria-hidden="true">›</span>
                    </button>
                    <button type="button" class="today-btn" (click)="goToToday()">
                        Hoy
                    </button>
                </div>
                <button type="button" (click)="openCreateEventModal()" class="accent-button create-event-btn">
                    <span aria-hidden="true">+</span>
                    <span>Crear</span>
                </button>
            </header>

            <div class="calendar-grid-panel">
                <div class="weekdays-row">
                    <div *ngFor="let day of weekDays" class="weekday-label">
                        {{ day }}
                    </div>
                </div>

                <div class="days-grid">
                    <button
                        type="button"
                        *ngFor="let day of daysInView"
                        class="calendar-day-cell"
                        [ngClass]="getDayClasses(day)"
                        [disabled]="day.isEmpty"
                        (click)="!day.isEmpty && selectDate(day.date)"
                    >
                        <ng-container *ngIf="!day.isEmpty">
                            <span [class]="getDayNumberClasses(day)">{{ day.day }}</span>
                            <span *ngIf="day.hasEvents" class="event-dot" aria-label="Tiene eventos"></span>
                        </ng-container>
                    </button>
                </div>
            </div>
        </section>

        <!-- Panel Lateral (Agenda) -->
        <aside class="agenda-panel" aria-label="Agenda del día">
            <h3 class="agenda-title">{{ agendaDate }}</h3>

            <div class="agenda-list">
                <button
                    type="button"
                    *ngFor="let event of agendaEvents"
                    (click)="openViewEventModal(event)"
                    class="agenda-item"
                >
                    <span class="agenda-item-title">{{ event.title }}</span>
                    <span class="agenda-item-time">{{ event.date | date:'shortTime' }}</span>
                </button>

                <div *ngIf="agendaEvents.length === 0" class="agenda-empty">
                    <p>Sin eventos para este día</p>
                </div>
            </div>
        </aside>
    </div>
</div>

<!-- Sub-modal Crear Evento -->
<div *ngIf="showCreateEventModal" class="sub-modal-backdrop" (click)="closeCreateEventModal()">
    <div
        class="glass-modal"
        role="dialog"
        aria-modal="true"
        aria-label="Crear nuevo evento"
        (click)="$event.stopPropagation()"
    >
        <header class="sub-modal-header">
            <h2>Nuevo Evento</h2>
            <button type="button" class="nav-arrow-btn" (click)="closeCreateEventModal()" aria-label="Cerrar">
                <span aria-hidden="true">×</span>
            </button>
        </header>
        <form (ngSubmit)="createEvent()" class="sub-modal-form">
            <input
                [(ngModel)]="eventForm.title"
                name="title"
                type="text"
                placeholder="Título"
                aria-label="Título del evento"
                class="form-input"
                required
                autofocus
            />
            <div class="date-time-row">
                <input
                    [(ngModel)]="eventForm.date"
                    name="date"
                    type="date"
                    aria-label="Fecha del evento"
                    class="form-input"
                    required
                />
                <input
                    [(ngModel)]="eventForm.time"
                    name="time"
                    type="time"
                    aria-label="Hora del evento"
                    class="form-input"
                />
            </div>
            <textarea
                [(ngModel)]="eventForm.description"
                name="desc"
                placeholder="Detalles"
                aria-label="Detalles del evento"
                rows="3"
                class="form-input"
            ></textarea>
            <div class="sub-modal-actions">
                <button type="button" (click)="closeCreateEventModal()" class="cancel-link-btn">Cancelar</button>
                <button type="submit" class="accent-button save-btn" [disabled]="!eventForm.title">Guardar</button>
            </div>
        </form>
    </div>
</div>

<!-- Sub-modal Ver Evento -->
<div *ngIf="showViewEventModal && selectedEvent" class="sub-modal-backdrop" (click)="closeViewEventModal()">
    <div
        class="glass-modal"
        role="dialog"
        aria-modal="true"
        aria-label="Detalle del evento"
        (click)="$event.stopPropagation()"
    >
        <header class="sub-modal-header">
            <div>
                <h2>{{ selectedEvent.title }}</h2>
                <p class="event-meta">{{ selectedEvent.date | date:'fullDate' }} · {{ selectedEvent.date | date:'shortTime' }}</p>
            </div>
            <button type="button" class="nav-arrow-btn" (click)="closeViewEventModal()" aria-label="Cerrar">
                <span aria-hidden="true">×</span>
            </button>
        </header>
        <div class="event-description-box">
            <p>{{ selectedEvent.description || 'Sin descripción adicional.' }}</p>
        </div>
        <div class="sub-modal-actions">
            <button type="button" class="accent-button full-btn" (click)="closeViewEventModal()">Unirse a la reunión</button>
        </div>
    </div>
</div>
