<div class="modal-overlay" (click)="closeModal()">
    <article
        class="modal-content"
        role="dialog"
        aria-modal="true"
        aria-label="Agregar miembros al grupo"
        (click)="$event.stopPropagation()"
    >
        <header class="modal-header">
            <div>
                <h3>Agregar miembros</h3>
                <p class="modal-subtitle">Selecciona contactos para invitar a este espacio</p>
            </div>
            <button
                type="button"
                class="close-button"
                (click)="closeModal()"
                aria-label="Cerrar ventana"
            >
                <span aria-hidden="true">×</span>
            </button>
        </header>

        <div class="search-display">
            <input
                type="text"
                placeholder="Buscar amigos..."
                aria-label="Buscar amigos"
            />
        </div>

        <div class="users-display">
            <ul class="users-list">
                @for (user of users; track user._id) {
                    <li class="user-item" (click)="onUserClicked(user._id!, $event)">
                        <div class="user-checkbox">
                            <mat-checkbox
                                [checked]="selectedUsers.has(user._id!)"
                                (click)="onUserClicked(user._id!, $event)"
                            ></mat-checkbox>
                        </div>
                        <div class="user-avatar">
                            <img
                                [src]="user.profileImgUrl | orbitAvatar:(user._id || user.username)"
                                [alt]="user.username"
                            />
                        </div>
                        <span class="username">{{ user.username }}</span>
                    </li>
                } @empty {
                    <li class="empty-users">No hay más contactos disponibles para agregar.</li>
                }
            </ul>
        </div>

        <footer class="modal-footer">
            <button type="button" class="cancel-btn" (click)="closeModal()">Cancelar</button>
            <button
                type="button"
                class="primary-btn"
                [disabled]="selectedUsers.size === 0 || isLoading"
                (click)="addMembers($event)"
            >
                {{ isLoading ? 'Agregando...' : 'Agregar miembros' }}
            </button>
        </footer>
    </article>
</div>
