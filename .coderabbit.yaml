language: "es-ES"
early_access: false
reviews:
  profile: "assertive"
  request_changes_workflow: true
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - dev
      - main
  path_instructions:
    - path: "src/**/*.ts"
      instructions: |
        Revisar rigurosamente seguridad en Angular 19, TypeScript, WebRTC/Mediasoup y Socket.IO:
        - Prevenir XSS (evitar bypassSecurityTrust*, innerHTML sin sanitización y manipulación directa insegura del DOM).
        - Evitar fugas de tokens JWT, credenciales o secretos en localStorage/logs/consola.
        - Verificar teardown correcto de suscripciones RxJS y listeners de SocketService (socket.off y clearTimeout en OnDestroy).
        - Validar manejo explícito de errores y tipado estricto en servicios y componentes.
    - path: "src/**/*.html"
      instructions: |
        Revisar seguridad y buenas prácticas en plantillas Angular:
        - Prevenir XSS evitando bindings peligrosos ([innerHTML], [outerHTML], [href] sin validación).
        - Verificar enlaces externos con rel="noopener noreferrer" cuando usen target="_blank".
        - Validar uso de directivas de control de flujo modernas (@if, @for) y accesibilidad básica.
    - path: ".github/workflows/**"
      instructions: |
        Validar seguridad de GitHub Actions:
        - Principio de menor privilegio en permissions por job.
        - Prevenir script injection evitando interpolación directa de ${{ github.* }} o ${{ inputs.* }} dentro de run: (usar variables env:).
        - Confirmar fail-gates en severidades HIGH/CRITICAL y preservación de artefactos/SARIF.
chat:
  auto_reply: true
